<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>旅行手册 · 偏好问卷</title>
  <style>
    /* ===== Reset & Base ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: #f2f7f5;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 40px 20px;
    }

    .container {
      max-width: 720px;
      width: 100%;
      background: #ffffff;
      border-radius: 24px;
      padding: 44px 48px 36px;
      box-shadow: 0 12px 48px rgba(26, 58, 74, 0.08);
      transition: box-shadow 0.3s;
    }

    @media (max-width: 600px) {
      .container {
        padding: 28px 20px 24px;
      }
    }

    /* ===== Header ===== */
    .header {
      margin-bottom: 32px;
      border-bottom: 2px solid #eaf1ee;
      padding-bottom: 20px;
    }

    .header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a3a4a;
      display: flex;
      align-items: center;
      gap: 10px;
      letter-spacing: -0.3px;
    }

    .header h1 span {
      background: #eaf1ee;
      font-size: 22px;
      border-radius: 12px;
      padding: 0 6px;
    }

    .header .sub {
      color: #6f8a8a;
      font-size: 15px;
      margin-top: 4px;
      font-weight: 400;
    }

    /* ===== Form ===== */
    .form-group {
      margin-bottom: 22px;
    }

    label {
      display: block;
      font-weight: 600;
      font-size: 15px;
      color: #1a3a4a;
      margin-bottom: 5px;
    }

    label .hint {
      font-weight: 400;
      color: #8fa8a8;
      font-size: 13px;
      margin-left: 4px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 12px 16px;
      font-size: 15px;
      font-family: inherit;
      background: #fafcfb;
      border: 1.5px solid #dee9e5;
      border-radius: 12px;
      transition: border-color 0.2s, box-shadow 0.2s;
      color: #1a2e3a;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #3ba0a8;
      outline: none;
      box-shadow: 0 0 0 4px rgba(59, 160, 168, 0.10);
      background: #ffffff;
    }

    textarea {
      min-height: 76px;
      resize: vertical;
    }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    @media (max-width: 480px) {
      .row-2 {
        grid-template-columns: 1fr;
        gap: 0;
      }
    }

    /* ===== Checkbox Group ===== */
    .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }

    .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 400;
      font-size: 14px;
      background: #f4f9f7;
      padding: 8px 18px 8px 14px;
      border-radius: 40px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      border: 1px solid transparent;
      color: #1a3a4a;
    }

    .checkbox-group label:hover {
      background: #e6f0ec;
    }

    .checkbox-group input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #2a7a7a;
      flex-shrink: 0;
      margin: 0;
    }

    .checkbox-group label:has(input:checked) {
      background: #dcebe7;
      border-color: #8fc0b8;
    }

    /* ===== Region Select ===== */
    .region-hint {
      font-size: 12px;
      color: #8fa8a8;
      margin-top: 5px;
    }

    /* ===== Submit ===== */
    .btn-submit {
      background: #1a3a4a;
      color: #ffffff;
      border: none;
      padding: 16px 28px;
      border-radius: 14px;
      font-size: 17px;
      font-weight: 600;
      width: 100%;
      cursor: pointer;
      transition: background 0.25s, transform 0.1s;
      margin-top: 10px;
      letter-spacing: 0.3px;
    }

    .btn-submit:hover {
      background: #2a5a6a;
    }

    .btn-submit:active {
      transform: scale(0.98);
    }

    .footnote {
      text-align: center;
      color: #8fa8a8;
      font-size: 13px;
      margin-top: 18px;
      border-top: 1px solid #eaf1ee;
      padding-top: 18px;
    }

    /* ===== Field error ===== */
    input.invalid,
    select.invalid,
    textarea.invalid {
      border-color: #d9534f;
      background: #fff7f7;
    }

    .field-error {
      display: none;
      color: #c0392b;
      font-size: 13px;
      margin-top: 5px;
    }

    .field-error.show {
      display: block;
    }

    /* ===== Result modal ===== */
    .modal {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px 16px;
      background: rgba(26, 58, 74, 0.45);
      -webkit-backdrop-filter: blur(2px);
      backdrop-filter: blur(2px);
    }

    .modal.open {
      display: flex;
    }

    .modal-card {
      display: flex;
      flex-direction: column;
      width: 100%;
      max-width: 640px;
      max-height: calc(100vh - 48px);
      overflow: hidden;
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 24px 64px rgba(26, 58, 74, 0.28);
      animation: modal-pop 0.18s ease-out;
    }

    @keyframes modal-pop {
      from { transform: translateY(10px) scale(0.98); opacity: 0; }
      to   { transform: none; opacity: 1; }
    }

    .modal-head {
      padding: 20px 24px 14px;
      border-bottom: 1px solid #eaf1ee;
    }

    .modal-head h2 {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 19px;
      font-weight: 700;
      color: #1a3a4a;
    }

    .modal-head p {
      margin-top: 4px;
      color: #6f8a8a;
      font-size: 13.5px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .chip {
      font-size: 12.5px;
      color: #1a3a4a;
      background: #eaf1ee;
      border-radius: 999px;
      padding: 3px 10px;
    }

    .modal-body {
      padding: 16px 24px;
      overflow: auto;
    }

    .modal-body label {
      font-size: 13px;
      color: #6f8a8a;
    }

    #promptBox {
      width: 100%;
      min-height: 220px;
      max-height: 46vh;
      resize: vertical;
      padding: 12px 14px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 13px;
      line-height: 1.65;
      color: #1a2e3a;
      background: #fafcfb;
      border: 1.5px solid #dee9e5;
      border-radius: 12px;
    }

    #promptBox:focus {
      outline: none;
      border-color: #3ba0a8;
      box-shadow: 0 0 0 4px rgba(59, 160, 168, 0.10);
    }

    .modal-foot {
      display: flex;
      gap: 10px;
      padding: 14px 24px 20px;
      border-top: 1px solid #eaf1ee;
    }

    .btn {
      padding: 13px 18px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 600;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      flex: 1;
      background: #1a3a4a;
      color: #ffffff;
    }

    .btn-primary:hover {
      background: #2a5a6a;
    }

    .btn-primary.copied {
      background: #2a7a7a;
    }

    .btn-ghost {
      background: #f2f7f5;
      color: #1a3a4a;
      border: 1px solid #dee9e5;
    }

    .btn-ghost:hover {
      background: #e6f0ec;
    }

    @media (max-width: 480px) {
      .modal {
        padding: 0;
      }
      .modal-card {
        max-height: 100vh;
        border-radius: 0;
      }
      .modal-foot {
        flex-direction: column-reverse;
      }
    }

    /* ===== Utility ===== */
    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>

  <div class="container">
    <!-- HEADER -->
    <div class="header">
      <h1>
        <span>🧳</span> 旅行手册
      </h1>
      <div class="sub">填写你的旅行偏好 · 生成专属指南</div>
    </div>

    <!-- FORM -->
    <form id="travelForm" autocomplete="off">

      <!-- 目的地 -->
      <div class="form-group">
        <label for="destination">目的地 <span class="hint">（城市名称）</span></label>
        <input
          type="text"
          id="destination"
          placeholder="例如：成都、西安、东京、巴黎"
          aria-describedby="err-destination"
          required
        />
        <div class="field-error" id="err-destination">请填写目的地</div>
      </div>

      <!-- 天数 + 人数 -->
      <div class="row-2">
        <div class="form-group">
          <label for="days">天数</label>
          <input type="number" id="days" placeholder="3" min="1" max="21" required />
        </div>
        <div class="form-group">
          <label for="travelers">人数</label>
          <input type="number" id="travelers" placeholder="2" min="1" max="20" required />
        </div>
      </div>

      <!-- 旅行风格（多选） -->
      <div class="form-group">
        <label>旅行风格 <span class="hint">（可多选）</span></label>
        <div class="checkbox-group" id="styleGroup">
          <label><input type="checkbox" value="文化历史" /> 文化历史</label>
          <label><input type="checkbox" value="美食探索" /> 美食探索</label>
          <label><input type="checkbox" value="自然风光" /> 自然风光</label>
          <label><input type="checkbox" value="休闲放松" /> 休闲放松</label>
          <label><input type="checkbox" value="购物血拼" /> 购物血拼</label>
          <label><input type="checkbox" value="亲子家庭" /> 亲子家庭</label>
        </div>
      </div>

      <!-- 特别偏好（可选） -->
      <div class="form-group">
        <label for="preferences">特别偏好 <span class="hint">（可选）</span></label>
        <textarea
          id="preferences"
          placeholder="例如：喜欢逛本地市场、想体验茶文化、对历史建筑感兴趣…"
        ></textarea>
      </div>

      <!-- 区域确认（新增：替代配色选择） -->
      <div class="form-group">
        <label for="regionConfirm">📍 目的地位置 <span class="hint">（用于选择地图和评分来源）</span></label>
        <select id="regionConfirm">
          <option value="auto">自动判断（推荐）</option>
          <option value="domestic">中国境内（百度地图 + 大众点评）</option>
          <option value="international">境外（Google Maps）</option>
        </select>
        <div class="region-hint">系统将根据目的地自动判断，如有误差可手动修正</div>
      </div>

      <!-- 提交 -->
      <button type="submit" class="btn-submit">✨ 生成旅行手册</button>

      <div class="footnote">提交后会生成一段需求提示词，复制发给助手即可开始生成</div>
    </form>
  </div>

  <!-- ============================================================ -->
  <!-- 结果弹窗：展示可直接复制给助手的需求提示词 -->
  <!-- ============================================================ -->
  <div class="modal" id="resultModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">✅ 需求提示词已生成</h2>
        <p>复制下面这段，发给助手即可开始生成你的旅行手册。</p>
        <div class="chips" id="summaryChips"></div>
      </div>
      <div class="modal-body">
        <label for="promptBox">需求提示词（可编辑）</label>
        <textarea id="promptBox" spellcheck="false"></textarea>
      </div>
      <div class="modal-foot">
        <button type="button" class="btn btn-primary" id="copyBtn">📋 复制提示词</button>
        <button type="button" class="btn btn-ghost" id="closeBtn">✏️ 返回修改</button>
      </div>
    </div>
  </div>

  <!-- ============================================================ -->
  <!-- JAVASCRIPT -->
  <script>
    (function() {
      const FORM = document.getElementById('travelForm');
      const STORAGE_KEY = 'travelGuideFormData';

      // ---------- 工具 ----------
      function getVal(id) {
        const el = document.getElementById(id);
        return el ? el.value.trim() : '';
      }

      function getCheckedValues(groupId) {
        const container = document.getElementById(groupId);
        if (!container) return [];
        const checks = container.querySelectorAll('input[type="checkbox"]:checked');
        return Array.from(checks).map(cb => cb.value);
      }

      function setVal(id, value) {
        const el = document.getElementById(id);
        if (el) el.value = value;
      }

      // ---------- 保存 / 加载 ----------
      function saveForm() {
        try {
          const data = {
            destination: getVal('destination'),
            days: getVal('days'),
            travelers: getVal('travelers'),
            styles: getCheckedValues('styleGroup'),
            preferences: getVal('preferences'),
            regionConfirm: getVal('regionConfirm'),
          };
          localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        } catch (_) { /* ignore */ }
      }

      function loadForm() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          if (!raw) return;
          const data = JSON.parse(raw);

          if (data.destination) setVal('destination', data.destination);
          if (data.days) setVal('days', data.days);
          if (data.travelers) setVal('travelers', data.travelers);
          if (data.preferences !== undefined) setVal('preferences', data.preferences);
          if (data.regionConfirm) setVal('regionConfirm', data.regionConfirm);

          // 恢复多选
          if (data.styles && Array.isArray(data.styles)) {
            const container = document.getElementById('styleGroup');
            if (container) {
              const checks = container.querySelectorAll('input[type="checkbox"]');
              checks.forEach(cb => {
                cb.checked = data.styles.includes(cb.value);
              });
            }
          }
        } catch (_) { /* ignore */ }
      }

      // ---------- 自动保存（输入时） ----------
      function autoSave() {
        saveForm();
      }

      // ---------- 收集数据 ----------
      function collectFormData() {
        return {
          destination: getVal('destination'),
          days: parseInt(getVal('days')) || 3,
          travelers: parseInt(getVal('travelers')) || 2,
          styles: getCheckedValues('styleGroup'),
          preferences: getVal('preferences'),
          regionConfirm: getVal('regionConfirm') || 'auto',
        };
      }

      // ---------- 区域文案 ----------
      function regionText(value) {
        if (value === 'domestic') return '中国境内（百度地图 + 大众点评）';
        if (value === 'international') return '境外（Google Maps）';
        return '自动判断（境内用百度地图 + 大众点评，境外用 Google Maps）';
      }

      // ---------- 生成需求提示词 ----------
      // 这是本页唯一交付物：一段自包含、可直接粘给助手的自然语言需求。
      function buildPrompt(data) {
        const styles = data.styles.length ? data.styles.join('、') : '未指定（按主流默认安排）';
        return [
          '请用 inChina-travel-guide-skill 为我生成一份完整的旅行手册。',
          '',
          '【旅行需求】',
          '- 目的地：' + data.destination,
          '- 天数：' + data.days + ' 天',
          '- 人数：' + data.travelers + ' 人',
          '- 旅行风格：' + styles,
          '- 区域判定：' + regionText(data.regionConfirm),
          '- 特别偏好：' + (data.preferences || '无特别偏好'),
          '',
          '【输出要求】',
          '1. 严格按 7 个模块输出单页 HTML 手册：行程 / 景点 / 体验 / 餐饮住宿 / 购物 / 当地贴士 / 未安排的景点清单。',
          '2. 行程模块只写片区范围（顺路片区或地铁站一带），具体餐厅与酒店的名称放在「餐饮住宿」模块。',
          '3. 境内酒店取携程高分、餐厅取大众点评高分；境外酒店与餐厅取 Google 高分。',
          '4. 交付一页可直接保存的 HTML 手册，配同级本地图片目录，手机与电脑都能正常查看。',
          '',
          '【以下信息我还没给，请按保守、主流的首次到访方案安排，不必回头追问】',
          '- 具体出行日期与时间',
          '- 预算档位',
          '- 交通与住宿（若我已订好会另外发截图或文字）',
          '- 必去清单 / 排除项',
          '- 饮食禁忌或无障碍等特殊需求',
        ].join('\n');
      }

      // ---------- 弹窗 ----------
      const MODAL = document.getElementById('resultModal');
      const PROMPT_BOX = document.getElementById('promptBox');
      const COPY_BTN = document.getElementById('copyBtn');
      const CLOSE_BTN = document.getElementById('closeBtn');
      const CHIPS = document.getElementById('summaryChips');
      let lastFocused = null;

      function openModal(data) {
        PROMPT_BOX.value = buildPrompt(data);

        const chips = [
          '📍 ' + data.destination,
          '📅 ' + data.days + ' 天',
          '👥 ' + data.travelers + ' 人',
        ];
        if (data.styles.length) chips.push('🎨 ' + data.styles.join('、'));
        chips.push(data.regionConfirm === 'international' ? '🗺️ 境外' :
                   data.regionConfirm === 'domestic' ? '🗺️ 境内' : '🗺️ 自动判定');

        CHIPS.innerHTML = '';
        chips.forEach(function(t) {
          const span = document.createElement('span');
          span.className = 'chip';
          span.textContent = t;
          CHIPS.appendChild(span);
        });

        lastFocused = document.activeElement;
        MODAL.classList.add('open');
        document.body.style.overflow = 'hidden';
        COPY_BTN.focus();
        COPY_BTN.select && COPY_BTN.select();
      }

      function closeModal() {
        MODAL.classList.remove('open');
        document.body.style.overflow = '';
        resetCopyBtn();
        if (lastFocused && typeof lastFocused.focus === 'function') lastFocused.focus();
      }

      let copyTimer = null;
      function resetCopyBtn() {
        if (copyTimer) clearTimeout(copyTimer);
        copyTimer = null;
        COPY_BTN.classList.remove('copied');
        COPY_BTN.textContent = '📋 复制提示词';
      }

      function flashCopyBtn(text, copied) {
        if (copyTimer) clearTimeout(copyTimer);
        COPY_BTN.classList.toggle('copied', !!copied);
        COPY_BTN.textContent = text;
        copyTimer = setTimeout(resetCopyBtn, copied ? 2000 : 2800);
      }

      function selectPrompt() {
        PROMPT_BOX.focus();
        PROMPT_BOX.select();
        PROMPT_BOX.setSelectionRange(0, PROMPT_BOX.value.length);
      }

      function copyPrompt() {
        const text = PROMPT_BOX.value;
        const afterCopy = function(ok) {
          if (ok) {
            flashCopyBtn('✅ 已复制', true);
          } else {
            selectPrompt();
            flashCopyBtn('请按 Ctrl/Cmd + C', false);
          }
        };

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(text).then(
            function() { afterCopy(true); },
            function() { afterCopy(legacyCopy()); }
          );
        } else {
          afterCopy(legacyCopy());
        }
      }

      // file:// 或无剪贴板权限时的兜底
      function legacyCopy() {
        try {
          selectPrompt();
          return document.execCommand('copy');
        } catch (_) {
          return false;
        }
      }

      COPY_BTN.addEventListener('click', copyPrompt);
      CLOSE_BTN.addEventListener('click', closeModal);

      // 点遮罩关闭
      MODAL.addEventListener('click', function(e) {
        if (e.target === MODAL) closeModal();
      });

      // Esc 关闭
      document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape' && MODAL.classList.contains('open')) closeModal();
      });

      // ---------- 提交 ----------
      FORM.addEventListener('submit', function(e) {
        e.preventDefault();

        const data = collectFormData();
        const destEl = document.getElementById('destination');
        const errEl = document.getElementById('err-destination');

        if (!data.destination) {
          destEl.classList.add('invalid');
          errEl.classList.add('show');
          destEl.focus();
          return;
        }

        destEl.classList.remove('invalid');
        errEl.classList.remove('show');

        // 保存
        saveForm();

        // 生成提示词并弹出结果
        openModal(data);

        // 也输出到控制台（方便调试）
        console.log('📋 表单数据：', data);
        console.log('🔗 可传递给助手的参数：', new URLSearchParams({
          destination: data.destination,
          days: data.days,
          travelers: data.travelers,
          styles: data.styles.join(','),
          preferences: data.preferences,
          region: data.regionConfirm,
        }).toString());
      });

      // 修正目的地后清掉错误态
      document.getElementById('destination').addEventListener('input', function() {
        if (this.value.trim()) {
          this.classList.remove('invalid');
          document.getElementById('err-destination').classList.remove('show');
        }
      });

      // ---------- 绑定自动保存 ----------
      const inputs = FORM.querySelectorAll('input, textarea, select');
      inputs.forEach(el => {
        el.addEventListener('change', autoSave);
        el.addEventListener('input', autoSave);
      });

      // ---------- 初始化 ----------
      loadForm();

      // 额外：如果用户清除了 localStorage，可通过此方法重置（不暴露 UI，但可用）
      console.log('💡 如需重置表单，在控制台执行：localStorage.removeItem("travelGuideFormData")');

    })();
  </script>

</body>
</html>
